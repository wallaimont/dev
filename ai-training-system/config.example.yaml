task: classification

data:
  train_path: data/customer_churn_sample.csv
  target_column: churned
  test_size: 0.25
  random_state: 42

model:
  name: random_forest
  params:
    n_estimators: 200
    max_depth: 8

training:
  use_cv: true
  cv_folds: 3
  search_strategy: grid
  search_params:
    n_estimators: [100, 200]
    max_depth: [6, 8, 10]
  scoring: f1_weighted
  n_jobs: -1

output:
  model_path: artifacts/model.joblib
  metrics_path: artifacts/metrics.json
  cv_results_path: artifacts/cv_results.json
