spring:
  application:
    name: orbyt-market-backend
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:orbyt_market}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}
    listener:
      auto-startup: false

server:
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt-secret: ${APP_JWT_SECRET:change-me-super-secret-change-me-super-secret}
    jwt-expiration-seconds: ${APP_JWT_EXPIRATION:3600}
    refresh-expiration-seconds: ${APP_REFRESH_EXPIRATION:2592000}

logging:
  level:
    org.springframework.security: WARN
