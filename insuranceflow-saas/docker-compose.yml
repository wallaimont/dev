services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insuranceflow
      POSTGRES_USER: insuranceflow
      POSTGRES_PASSWORD: insuranceflow2025
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insuranceflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: insuranceflow
      DB_USERNAME: insuranceflow
      DB_PASSWORD: insuranceflow2025
      JWT_SECRET: YjVkNjIzMzBiNmY4NDNkMmFkZjVlMGQwNjRmMmU5N2IxYzVmOTg0OTdhNjY0MmRkODRlYTgzMjRlNWQ1YWVmMQ==
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
