# SIGA Seguros
spring.application.name=siga-seguros

# Server
server.port=8080
server.servlet.context-path=/

# Default profile: H2 in-memory for development
spring.profiles.active=dev

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# JWT
app.jwt.secret=c2lnYS1zZWd1cm9zLXNlY3JldC1rZXktcHJvZHVjdGlvbi0yMDI2LXNlY3VyZS1yYW5kb20
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Upload directory
app.upload.dir=./uploads

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.sigaseguros=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
