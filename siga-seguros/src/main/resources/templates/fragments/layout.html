<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | SIGA Seguros'">SIGA Seguros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<!-- Sidebar -->
<nav th:fragment="sidebar" class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="/app/dashboard" class="sidebar-brand">
            <div class="brand-icon">
                <i class="bi bi-shield-check"></i>
            </div>
            <span>SIGA</span>
        </a>
        <button class="sidebar-toggle d-lg-none" onclick="toggleSidebar()">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>
    <ul class="sidebar-nav">
        <li class="sidebar-item">
            <a th:href="@{/app/dashboard}" class="sidebar-link" data-page="dashboard">
                <i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span>
            </a>
        </li>
        <li class="sidebar-divider"><span>Comercial</span></li>
        <li class="sidebar-item">
            <a th:href="@{/app/clientes}" class="sidebar-link" data-page="clientes">
                <i class="bi bi-people-fill"></i><span>Clientes</span>
            </a>
        </li>
        <li class="sidebar-item">
            <a th:href="@{/app/propostas}" class="sidebar-link" data-page="propostas">
                <i class="bi bi-file-earmark-text-fill"></i><span>Propostas</span>
            </a>
        </li>
        <li class="sidebar-item">
            <a th:href="@{/app/apolices}" class="sidebar-link" data-page="apolices">
                <i class="bi bi-file-earmark-check-fill"></i><span>Ap&#243;lices</span>
            </a>
        </li>
        <li class="sidebar-item">
            <a th:href="@{/app/renovacoes}" class="sidebar-link" data-page="renovacoes">
                <i class="bi bi-arrow-repeat"></i><span>Renova&#231;&#245;es</span>
            </a>
        </li>
        <li class="sidebar-item">
            <a th:href="@{/app/sinistros}" class="sidebar-link" data-page="sinistros">
                <i class="bi bi-exclamation-triangle-fill"></i><span>Sinistros</span>
            </a>
        </li>
        <li class="sidebar-divider"><span>Financeiro</span></li>
        <li class="sidebar-item">
            <a th:href="@{/app/financeiro}" class="sidebar-link" data-page="financeiro">
                <i class="bi bi-wallet2"></i><span>Financeiro</span>
            </a>
        </li>
        <li class="sidebar-item">
            <a th:href="@{/app/comissoes}" class="sidebar-link" data-page="comissoes">
                <i class="bi bi-pie-chart-fill"></i><span>Comiss&#245;es</span>
            </a>
        </li>
        <li class="sidebar-divider"><span>Cadastros</span></li>
        <li class="sidebar-item">
            <a th:href="@{/app/seguradoras}" class="sidebar-link" data-page="seguradoras">
                <i class="bi bi-building-fill"></i><span>Seguradoras</span>
            </a>
        </li>
        <li class="sidebar-item">
            <a th:href="@{/app/corretoras}" class="sidebar-link" data-page="corretoras">
                <i class="bi bi-briefcase-fill"></i><span>Corretoras</span>
            </a>
        </li>
        <li class="sidebar-divider"><span>Sistema</span></li>
        <li class="sidebar-item">
            <a th:href="@{/app/usuarios}" class="sidebar-link" data-page="usuarios">
                <i class="bi bi-person-fill-gear"></i><span>Usu&#225;rios</span>
            </a>
        </li>
        <li class="sidebar-item">
            <a th:href="@{/app/auditoria}" class="sidebar-link" data-page="auditoria">
                <i class="bi bi-journal-text"></i><span>Auditoria</span>
            </a>
        </li>
    </ul>
</nav>

<!-- Topbar -->
<header th:fragment="topbar" class="topbar">
    <button class="btn btn-link sidebar-toggle-btn d-lg-none" onclick="toggleSidebar()">
        <i class="bi bi-list fs-4"></i>
    </button>
    <div class="topbar-search d-none d-md-flex">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Buscar clientes, ap&#243;lices, propostas..." class="form-control" id="globalSearch">
    </div>
    <div class="topbar-right">
        <button class="topbar-icon-btn" title="Notifica&#231;&#245;es" onclick="showToast('Nenhuma notifica&#231;&#227;o pendente', 'info')">
            <i class="bi bi-bell"></i>
            <span class="badge-dot"></span>
        </button>
        <div class="topbar-divider d-none d-md-block"></div>
        <div class="dropdown">
            <button class="btn topbar-user dropdown-toggle" data-bs-toggle="dropdown">
                <div class="avatar-sm">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="d-none d-md-block text-start">
                    <div id="userName" style="line-height:1.2">Usu&#225;rio</div>
                    <small class="text-muted" style="font-size:11px" id="userRole">Admin</small>
                </div>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" onclick="alterarSenha()"><i class="bi bi-key me-2"></i>Alterar Senha</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Sair</a></li>
            </ul>
        </div>
    </div>
</header>

<!-- Page Wrapper fragment -->
<div th:fragment="pageWrapper(content)" class="main-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <div class="content-area">
            <th:block th:insert="${content}"/>
        </div>
    </div>
</div>

<!-- Scripts fragment -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</div>

<!-- Toast container -->
<div th:fragment="toasts" class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<!-- Modal template -->
<div th:fragment="modal(id, title, size)" class="modal fade" th:id="${id}" tabindex="-1">
    <div class="modal-dialog" th:classappend="${size != null ? 'modal-' + size : ''}">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" th:text="${title}">Modal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer"></div>
        </div>
    </div>
</div>

</body>
</html>
