<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SIGA Seguros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-icon">
                <i class="bi bi-shield-check"></i>
            </div>
            <h1>SIGA Seguros</h1>
            <p>Sistema Integrado de Gest&#227;o para Administradora</p>
        </div>
        <div class="alert alert-danger d-none" id="loginError"></div>
        <form onsubmit="doLogin(event)">
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="seu@email.com" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="senha" placeholder="Sua senha" required>
                    <button type="button" class="input-group-text" onclick="togglePassword()" style="cursor:pointer">
                        <i class="bi bi-eye" id="togglePwdIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
            </button>
            <p style="text-align:center; margin-top:24px; font-size:12px; color:rgba(255,255,255,0.3);">
                &#169; 2024 SIGA Seguros. Todos os direitos reservados.
            </p>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
function togglePassword() {
    const input = document.getElementById('senha');
    const icon = document.getElementById('togglePwdIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
}
</script>
</body>
</html>
