<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Comiss\u00f5es')}"></head>
<body>
<div class="main-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <div class="content-area">
            <div class="page-header">
                <div><h1 class="page-title">Comiss&#245;es</h1><p class="page-subtitle">Controle de comiss&#245;es e repasses</p></div>
                <button class="btn btn-primary" onclick="novaComissao()"><i class="bi bi-plus-lg me-1"></i>Nova Comiss&#227;o</button>
            </div>
            <div class="table-container">
                <div class="table-toolbar">
                    <div class="table-filters">
                        <select class="form-select" id="fStatus" onchange="loadComissoes()">
                            <option value="">Todos os status</option>
                            <option value="PENDENTE">Pendente</option>
                            <option value="RECEBIDA">Recebida</option>
                            <option value="ATRASADA">Atrasada</option>
                        </select>
                        <button class="btn btn-outline-secondary btn-sm" onclick="loadComissoes()"><i class="bi bi-search me-1"></i>Filtrar</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead><tr><th>Origem</th><th>Favorecido</th><th>Valor</th><th>Prevista</th><th>Recebimento</th><th>Status</th><th width="130">A&#231;&#245;es</th></tr></thead>
                        <tbody id="tblData"><tr><td colspan="7" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Carregando...</td></tr></tbody>
                    </table>
                </div>
                <div class="table-pagination" id="pagination"></div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: toasts}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
async function loadComissoes(page = 0) {
    const params = new URLSearchParams({ page, size: 20 });
    const status = document.getElementById('fStatus').value;
    if (status) params.append('status', status);
    try {
        const res = await API.get('/comissoes?' + params);
        const data = res.data;
        const tb = document.getElementById('tblData');
        if (data.content.length === 0) {
            tb.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4"><i class="bi bi-inbox me-2"></i>Nenhuma comiss\u00e3o encontrada</td></tr>';
        } else {
            tb.innerHTML = data.content.map(c => `<tr>
                <td>${c.apoliceNumero || '-'}</td>
                <td>${c.favorecido || '-'}</td>
                <td><strong>${formatCurrency(c.valorComissao)}</strong></td>
                <td>${formatDate(c.dataPrevista)}</td>
                <td>${c.dataRecebimento ? formatDate(c.dataRecebimento) : '-'}</td>
                <td>${statusBadge(c.status)}</td>
                <td>
                    ${canEdit('comissoes') ? `<button class="btn btn-icon btn-outline-primary btn-sm me-1" onclick="editarComissao(${c.id})" title="Editar"><i class="bi bi-pencil"></i></button>` : ''}
                    ${canEdit('comissoes') ? `<button class="btn btn-icon btn-outline-warning btn-sm" onclick="alterarStatusComissao(${c.id})" title="Status"><i class="bi bi-arrow-repeat"></i></button>` : ''}
                </td>
            </tr>`).join('');
        }
        document.getElementById('pagination').innerHTML = renderPagination(data, 'loadComissoes');
    } catch (err) { showToast(err.message, 'danger'); }
}

function formComissao(c = {}) {
    return `<form id="formComissao"><div class="row g-3">
        <div class="col-md-4"><label class="form-label">Ap&#243;lice ID</label><input type="number" class="form-control" id="cApoliceId" value="${c.apoliceId || ''}" required></div>
        <div class="col-md-4"><label class="form-label">Valor</label><input type="number" step="0.01" class="form-control" id="cValor" value="${c.valorComissao || ''}" required></div>
        <div class="col-md-4"><label class="form-label">% Comiss&#227;o</label><input type="number" step="0.01" class="form-control" id="cPercentual" value="${c.percentual || ''}"></div>
        <div class="col-md-4"><label class="form-label">Data Prevista</label><input type="text" class="form-control" id="cPrevista" value="${c.dataPrevista || ''}" placeholder="dd/mm/aaaa" required></div>
        <div class="col-md-4"><label class="form-label">Data Recebimento</label><input type="text" class="form-control" id="cRecebimento" value="${c.dataRecebimento || ''}" placeholder="dd/mm/aaaa"></div>
        <div class="col-md-4"><label class="form-label">Favorecido</label><input type="text" class="form-control" id="cFavorecido" value="${c.favorecido || ''}"></div>
        <div class="col-12"><label class="form-label">Observa&#231;&#245;es</label><textarea class="form-control" id="cObs" rows="2">${c.observacoes || ''}</textarea></div>
    </div></form>`;
}

function getComissaoData() {
    return {
        apoliceId: document.getElementById('cApoliceId').value,
        valorComissao: document.getElementById('cValor').value,
        percentual: document.getElementById('cPercentual').value,
        dataPrevista: document.getElementById('cPrevista').value,
        dataRecebimento: document.getElementById('cRecebimento').value || null,
        favorecido: document.getElementById('cFavorecido').value,
        observacoes: document.getElementById('cObs').value
    };
}

function novaComissao() {
    showModal('Nova Comiss\u00e3o', formComissao(), async () => {
        await API.post('/comissoes', getComissaoData());
        showToast('Comiss\u00e3o registrada com sucesso');
        bootstrap.Modal.getInstance(document.getElementById('dynamicModal')).hide();
        loadComissoes();
    });
}

async function editarComissao(id) {
    const res = await API.get('/comissoes/' + id);
    showModal('Editar Comiss\u00e3o', formComissao(res.data), async () => {
        await API.put('/comissoes/' + id, getComissaoData());
        showToast('Comiss\u00e3o atualizada');
        bootstrap.Modal.getInstance(document.getElementById('dynamicModal')).hide();
        loadComissoes();
    });
}

function alterarStatusComissao(id) {
    showModal('Alterar Status', `<select class="form-select" id="novoStatus">
        <option value="PENDENTE">Pendente</option><option value="RECEBIDA">Recebida</option><option value="ATRASADA">Atrasada</option>
    </select>`, async () => {
        await API.patch('/comissoes/' + id + '/status?status=' + document.getElementById('novoStatus').value);
        showToast('Status alterado');
        bootstrap.Modal.getInstance(document.getElementById('dynamicModal')).hide();
        loadComissoes();
    });
}

document.addEventListener('DOMContentLoaded', loadComissoes);
</script>
</body>
</html>
