spring:
  application:
    name: supportdesk-pro-x

  datasource:
    url: jdbc:postgresql://localhost:5432/supportdesk_pro_x
    username: sdpx_user
    password: sdpx_pass_2024
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  data:
    redis:
      host: localhost
      port: 6379
      password: sdpx_redis_2024
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 min default TTL

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        spring.json.add.type.headers: false
    consumer:
      group-id: sdpx-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.supportdesk.*"
    listener:
      ack-mode: MANUAL_IMMEDIATE

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB

  threads:
    virtual:
      enabled: true  # Java 21 Virtual Threads

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200
      min-spare: 10

management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,kafka,storageHealthIndicator
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tags-sorter: alpha

app:
  jwt:
    private-key-path: classpath:keys/private-key.pem
    public-key-path: classpath:keys/public-key.pem
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    issuer: supportdesk-pro-x

  cors:
    allowed-origins:
      - http://localhost:4200

  bootstrap-admin:
    enabled: true
    name: System Administrator
    email: admin@supportdesk.com
    password: ${APP_ADMIN_PASSWORD:Admin@2024!}
    force-password-reset-on-startup: false

  storage:
    upload-dir: ./uploads
    max-file-size-bytes: 26214400
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - text/plain
      - text/csv

  sla:
    low-hours: 72
    medium-hours: 48
    high-hours: 24
    critical-hours: 4

  outbox:
    polling-interval-ms: 5000
    max-retry-attempts: 3

logging:
  level:
    root: INFO
    com.supportdesk: DEBUG
    org.springframework.security: WARN
    org.springframework.kafka: INFO
