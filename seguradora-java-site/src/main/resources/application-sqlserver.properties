server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:seguradora_site};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_CERTIFICATE:true};loginTimeout=${DB_LOGIN_TIMEOUT:30}}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=false

app.jwt.secret=${APP_JWT_SECRET:VGhpc0lzQVNlY3JldEtleUZvckpXVEF1dGhXaXRoQmFzZTY0MTIzNDU2Nzg5MCE=}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}