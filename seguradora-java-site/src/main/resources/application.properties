server.port=8081
spring.datasource.url=jdbc:h2:file:./data/seguradora-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=false
app.jwt.secret=VGhpc0lzQVNlY3JldEtleUZvckpXVEF1dGhXaXRoQmFzZTY0MTIzNDU2Nzg5MCE=
app.jwt.expiration-ms=86400000
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

app.form-validation.enhanced-enabled=true
app.form-validation.fallback-to-legacy-on-error=true
app.form-validation.telemetry-enabled=true
app.form-validation.duplicate-window-seconds=20
